apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
spec:
  # No replicas: the backend-api HorizontalPodAutoscaler (autoscaling.yaml) sets it.
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-api
    spec:
      serviceAccountName: anseliq-backend
      # preStop's sleep plus shutdown, which has no jobs to drain here.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      initContainers:
        # Applies pending database migrations before the app starts. Pods starting together are
        # safe: Flyway's advisory lock makes the rest wait, then find nothing left to do.
        - name: migrate
          image: anseliq-backend
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: anseliq-config
            - secretRef:
                name: anseliq-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: backend
          image: anseliq-backend
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 8081
          env:
            - name: HTTP_ENABLED
              value: "true"
            - name: SCHEDULER_ENABLED
              value: "false"
            - name: WORKERS_ENABLED
              value: "false"
          envFrom:
            - configMapRef:
                name: anseliq-config
            - secretRef:
                name: anseliq-secrets
          # Until the API port accepts a connection from outside the pod, the other probes don't
          # run, so the pod gets no traffic; after 2 minutes the container is restarted. The health
          # endpoints are a separate server, so passing them doesn't show the API is reachable.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            # Keeps serving while the endpoint removal reaches every node and the ingress, so
            # requests still being routed here don't hit a closed port. The HTTP server can't drain
            # in-flight requests itself.
            preStop:
              exec:
                command: ["sleep", "10"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
spec:
  selector:
    app.kubernetes.io/name: backend-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-api

# The backend pods' identity. To read S3 with an IAM role instead of a fixed key, leave S3_USERNAME
# and S3_PASSWORD out of anseliq-secrets and give this account the role: on EKS, either an IRSA
# annotation (eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role>) or a Pod Identity
# association.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anseliq-backend

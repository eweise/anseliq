apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-worker
    spec:
      serviceAccountName: anseliq-backend
      # Room for SHUTDOWN_DRAIN_TIMEOUT (25s by default) to let running jobs finish, then requeue
      # whatever's left, before Kubernetes kills the process.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
      initContainers:
        # Applies pending database migrations before the app starts. Pods starting together are
        # safe: Flyway's advisory lock makes the rest wait, then find nothing left to do.
        - name: migrate
          image: anseliq-backend
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: anseliq-config
            - secretRef:
                name: anseliq-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: backend
          image: anseliq-backend
          ports:
            - name: health
              containerPort: 8081
          env:
            # The scheduler and every worker are on by default.
            - name: HTTP_ENABLED
              value: "false"
          envFrom:
            - configMapRef:
                name: anseliq-config
            - secretRef:
                name: anseliq-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
          # More memory than the API: reconciliation holds a pass's matching groups in memory.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false

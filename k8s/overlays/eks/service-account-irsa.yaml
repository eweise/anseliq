# The IAM role the backend pods read S3 with (IRSA), so no S3 key is needed in anseliq-secrets.
# With EKS Pod Identity instead, drop this patch and create a Pod Identity association for the
# anseliq-backend service account in the anseliq namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anseliq-backend
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::REPLACE_ME_AWS_ACCOUNT_ID:role/REPLACE_ME_S3_READ_ROLE

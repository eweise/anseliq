# The base Ingress, served by an ALB from the AWS Load Balancer Controller. TLS ends at the ALB with
# an ACM certificate; plain HTTP is redirected to HTTPS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anseliq
  annotations:
    # internal: reachable only from the customer's VPC and what's peered or VPN'd into it. Use
    # internet-facing to put it on the public internet.
    alb.ingress.kubernetes.io/scheme: internal
    # Routes straight to pod IPs, so the ALB's health checks and draining track the pods themselves.
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_ME_ACM_CERTIFICATE_ARN
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
spec:
  ingressClassName: alb

# The frontend image's nginx.conf (frontend/nginx.conf), plus /api passed to the backend-api service:
# with no ingress controller on the local cluster, the frontend's own nginx gives the browser the
# one origin the Ingress does elsewhere.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://backend-api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /static {
            alias /usr/share/nginx/html/static;
        }

        error_page 404 /index.html;
    }
}

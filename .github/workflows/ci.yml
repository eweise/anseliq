# Runs the tests on every push to main and every pull request, against a fresh Postgres (migrated
# by the backend's Flyway migrations) and LocalStack for S3, the same services local dev uses.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request supersedes a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Matches test-application.conf. Keep the image's default en_US.utf8 collation: it sorts text
      # linguistically like RDS does, unlike Postgres on macOS, and that's what catches code relying
      # on the database's sort order matching Scala's (see MovementRepoLive.byteOrdered).
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recon_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # For CreateFileInventoryTrackerS3Suite. LocalStack needs an auth token: set it as the
      # repository secret LOCALSTACK_AUTH_TOKEN. The image's own health check (python3 against
      # /_localstack/health) is what the job waits on; the image has no curl to write another with.
      localstack:
        image: localstack/localstack
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          SERVICES: s3
        ports: ["4566:4566"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # The commands are one ";"-separated argument because sbt 2's client reads its arguments as a
      # single command line. testFull, not test: sbt 2's test only reruns what failed or changed since
      # the last run. The frontend has no tests, so it's only compiled.
      - name: Test
        run: >-
          sbt
          "commonJVM/testFull; frontend/fastLinkJS; backend/runMain anseliq.app.Main migrate; backend/testFull"

db.name = "recon_db"
db.schema="recon"
db.host = "localhost"
db.port = 5432
db.database_name="recon_db"
db.user="postgres"
db.user=${?DB_USER}
db.password="postgres"
db.password=${?DB_PASSWORD}
# Per instance: across all replicas, max-connections plus the reconciler's 2 unpooled cursor
# connections (see DbDataSource) has to stay under Postgres's max_connections.
db.max-connections=10
db.max-connections=${?DB_MAX_CONNECTIONS}
db.min-idle=2
# How long a caller waits for a free pooled connection before failing.
db.connection-timeout=10s
jwt.secret="t0ps3cret-token-change-me-in-prod"
jwt.secret=${?JWT_SECRET}
s3.region="us-east-1"
s3.endpoint="http://localhost:4566"
s3.username="test"
s3.username=${?S3_USERNAME}
s3.password="test"
s3.password=${?S3_PASSWORD}
# Secondary matching of what the rule-based reconciler leaves unmatched (see MatchSuggestionService).
# Off by default. adapter is "disabled" (never suggests) or "local-llm" (LocalLlmMatchSuggester, a
# model served inside the install, e.g. by Ollama: `ollama pull qwen2.5:7b`).
match-suggestions.enabled=false
match-suggestions.enabled=${?MATCH_SUGGESTIONS_ENABLED}
match-suggestions.adapter="disabled"
match-suggestions.adapter=${?MATCH_SUGGESTIONS_ADAPTER}
match-suggestions.candidate-window-days=7
match-suggestions.max-candidates=10
# How many accepted suggestions a learned rule must explain before it's proposed for the spec.
match-suggestions.rule-proposal-min-examples=3
match-suggestions.local-llm.base-url="http://localhost:11434/v1"
match-suggestions.local-llm.base-url=${?LOCAL_LLM_BASE_URL}
match-suggestions.local-llm.model="qwen2.5:7b"
match-suggestions.local-llm.model=${?LOCAL_LLM_MODEL}
match-suggestions.local-llm.timeout-seconds=120
# Which parts of the app this instance runs, so a deployment can split them across pods, e.g. an
# HTTP deployment (WORKERS_ENABLED=false, SCHEDULER_ENABLED=false) and a worker deployment
# (HTTP_ENABLED=false). Any number of instances can run the same services: the job queue claims each
# job for one worker (see JobManager), and the scheduler's submissions dedupe to one queued job.
services.http.enabled=true
services.http.enabled=${?HTTP_ENABLED}
# The timers that queue the periodic jobs (CreateFileInventory, GenerateReconStats).
services.scheduler.enabled=true
services.scheduler.enabled=${?SCHEDULER_ENABLED}
# Default for every worker below; each can still be switched on or off on its own.
services.workers.enabled=true
services.workers.enabled=${?WORKERS_ENABLED}
services.workers.create-file-inventory.enabled=${services.workers.enabled}
services.workers.create-file-inventory.enabled=${?WORKER_CREATE_FILE_INVENTORY_ENABLED}
services.workers.create-file-inventory.polling-seconds=3
services.workers.ingestion.enabled=${services.workers.enabled}
services.workers.ingestion.enabled=${?WORKER_INGESTION_ENABLED}
services.workers.ingestion.polling-seconds=1
services.workers.reconciliation.enabled=${services.workers.enabled}
services.workers.reconciliation.enabled=${?WORKER_RECONCILIATION_ENABLED}
services.workers.reconciliation.polling-seconds=1
services.workers.generate-recon-stats.enabled=${services.workers.enabled}
services.workers.generate-recon-stats.enabled=${?WORKER_GENERATE_RECON_STATS_ENABLED}
services.workers.generate-recon-stats.polling-seconds=3
services.workers.suggest-matches.enabled=${services.workers.enabled}
services.workers.suggest-matches.enabled=${?WORKER_SUGGEST_MATCHES_ENABLED}
services.workers.suggest-matches.polling-seconds=3
# Kubernetes liveness (/health/live) and readiness (/health/ready) probes, served on every instance
# whatever else it runs (see HealthServer).
services.health.port=8081
services.health.port=${?HEALTH_PORT}
# On SIGTERM, how long to let running jobs finish before interrupting them and putting them back in
# the queue for another instance. Keep it under the pod's terminationGracePeriodSeconds (30s by
# default), or Kubernetes kills the process before the jobs are requeued.
services.shutdown.drain-timeout=25s
services.shutdown.drain-timeout=${?SHUTDOWN_DRAIN_TIMEOUT}
